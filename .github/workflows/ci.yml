name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    name: Validate, scan, and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate marketplace and plugin structure
        run: node scripts/validate-marketplace.mjs

      - name: Content scan
        run: node scripts/scan-content.mjs

      - name: Unit tests
        run: node --test "scripts/tests/*.test.mjs" "plugins/*/tests/*.test.mjs"
