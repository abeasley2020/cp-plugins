<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="t d">
  <title id="t">Plan view of a sandwich assembly line</title>
  <desc id="d">The worker's path runs from the trash bin back to the assembly table without passing the hand sink, which sits behind the line.</desc>
  <rect x="0" y="0" width="640" height="360" fill="#f7f5f0"/>
  <rect x="120" y="140" width="400" height="70" fill="#ffffff" stroke="#555960" stroke-width="2"/>
  <text x="320" y="182" font-family="Source Sans 3, Arial, sans-serif" font-size="20" text-anchor="middle" fill="#1f1f1f">Assembly table</text>
  <rect x="40" y="260" width="70" height="70" fill="#ffffff" stroke="#555960" stroke-width="2"/>
  <text x="75" y="300" font-family="Source Sans 3, Arial, sans-serif" font-size="18" text-anchor="middle" fill="#1f1f1f">Trash</text>
  <rect x="540" y="30" width="80" height="60" fill="#ffffff" stroke="#8e6f3e" stroke-width="3"/>
  <text x="580" y="66" font-family="Source Sans 3, Arial, sans-serif" font-size="18" text-anchor="middle" fill="#1f1f1f">Sink</text>
  <path d="M110 290 C 200 290, 220 240, 250 212" fill="none" stroke="#964f37" stroke-width="4" stroke-dasharray="10 8"/>
  <polygon points="250,212 236,218 246,228" fill="#964f37"/>
  <text x="150" y="250" font-family="Source Sans 3, Arial, sans-serif" font-size="18" fill="#1f1f1f">Worker's path</text>
  <text x="470" y="115" font-family="Source Sans 3, Arial, sans-serif" font-size="18" fill="#1f1f1f">Off the path</text>
</svg>
